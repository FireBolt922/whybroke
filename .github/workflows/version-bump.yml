name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      push_tag:
        description: "Also push the git tag (uncheck to only push the commit so the tag can be moved/recreated next run)"
        required: false
        default: true
        type: boolean

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bump-my-version
        run: pip install bump-my-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: bump-my-version bump ${{ inputs.bump }} --verbose

      - name: Push commit
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Push tag
        if: ${{ inputs.push_tag }}
        run: git push origin --tags --force
