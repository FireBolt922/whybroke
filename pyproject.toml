[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whybroke"
version = "0.1.0"
description = "Pipe any Python stack trace, get the fix in 8 seconds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ganesh" }]
keywords = ["debugging", "cli", "ai", "llm", "stacktrace", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-genai>=0.3.0",
    "litellm>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
whybroke = "whybroke.cli:app"

[project.urls]
Homepage = "https://github.com/FireBolt922/whybroke"
Issues = "https://github.com/FireBolt922/whybroke/issues"

[tool.hatch.build.targets.wheel]
packages = ["whybroke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
